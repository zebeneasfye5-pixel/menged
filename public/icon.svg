<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Inner circular road grid -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="16 12" opacity="0.4"/>
  <!-- Perspective Road -->
  <polygon points="176,390 336,390 286,210 226,210" fill="url(#road)" stroke="#475569" stroke-width="4"/>
  <!-- Road Dash Line -->
  <line x1="256" y1="230" x2="256" y2="380" stroke="#f59e0b" stroke-width="8" stroke-dasharray="24 16"/>
  <!-- Transport Vehicle / Bus / Bajaj Icon Front -->
  <rect x="206" y="140" width="100" height="90" rx="18" fill="#10b981" stroke="#ecfdf5" stroke-width="5"/>
  <rect x="218" y="152" width="76" height="38" rx="8" fill="#0f172a"/>
  <!-- Headlights -->
  <circle cx="224" cy="206" r="8" fill="#fbbf24"/>
  <circle cx="288" cy="206" r="8" fill="#fbbf24"/>
  <!-- Antenna Radio Beams -->
  <path d="M256,135 L256,105" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="100" r="7" fill="#38bdf8"/>
  <path d="M236,92 A28,28 0 0,1 276,92" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M220,80 A48,48 0 0,1 292,80" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Emblem typography -->
  <text x="256" y="445" font-family="sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">TRANSPORT</text>
  <text x="256" y="475" font-family="sans-serif" font-size="19" font-weight="700" fill="#34d399" text-anchor="middle">መንገድና ትራንስፖርት</text>
</svg>
